<!-- 웹앱 프로젝트 링크를 카드 형태로 관리하는 포트폴리오 대시보드 -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bluepapa's Vibecoding</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset & Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f1117;
      --surface:   #1a1d27;
      --surface2:  #22263a;
      --accent:    #6366f1;
      --accent-h:  #818cf8;
      --danger:    #ef4444;
      --text:      #e2e8f0;
      --text-muted:#94a3b8;
      --border:    #2d3147;
      --radius:    12px;
      --shadow:    0 4px 24px rgba(0,0,0,.4);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.25rem;
      font-weight: 400;
      letter-spacing: .3px;
      color: var(--accent-h);
    }

    .logo span { color: var(--text-muted); font-weight: 400; font-size: .85rem; margin-left: .5rem; }

    .btn-add {
      display: flex;
      align-items: center;
      gap: .4rem;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: .5rem 1.1rem;
      border-radius: 8px;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s;
    }
    .btn-add:hover { background: var(--accent-h); }
    .btn-add svg { width: 16px; height: 16px; }

    /* ── Main ── */
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    .section-title {
      font-size: .75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--text-muted);
      margin-bottom: 1.2rem;
    }

    /* ── Card Grid ── */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.2rem;
    }

    /* ── Empty State ── */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 2rem;
      color: var(--text-muted);
    }
    .empty-state svg { width: 56px; height: 56px; opacity: .35; margin-bottom: 1rem; }
    .empty-state p { font-size: 1rem; }
    .empty-state small { font-size: .85rem; opacity: .7; }

    /* ── Project Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem 1.25rem 1rem;
      display: flex;
      flex-direction: column;
      gap: .6rem;
      transition: border-color .2s, transform .15s;
      overflow: hidden;
    }
    .card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    /* ── Card Thumbnail ── */
    .card-thumb {
      margin: -1.25rem -1.25rem .75rem;
      border-radius: var(--radius) var(--radius) 0 0;
      overflow: hidden;
      aspect-ratio: 16/9;
      position: relative;
      background: var(--surface2);
    }
    .card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
      opacity: 0;
      transition: opacity .4s;
    }
    .card-thumb img.loaded { opacity: 1; }
    .thumb-skeleton {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, var(--surface2) 0%, var(--border) 50%, var(--surface2) 100%);
      background-size: 200% 100%;
      animation: shimmer 1.8s infinite;
    }
    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .card-header {
      display: flex;
      align-items: flex-start;
      gap: .75rem;
    }

    .card-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: var(--surface2);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 1.2rem;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.3;
      word-break: break-word;
    }

    .card-url {
      font-size: .75rem;
      color: var(--accent-h);
      word-break: break-all;
      opacity: .8;
    }

    .card-desc {
      font-size: .85rem;
      color: var(--text-muted);
      line-height: 1.55;
      flex: 1;
      word-break: break-word;
    }

    .card-footer {
      display: flex;
      gap: .5rem;
      margin-top: .4rem;
    }

    .btn-goto {
      flex: 1;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: .45rem .75rem;
      border-radius: 7px;
      font-size: .83rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      transition: background .2s;
    }
    .btn-goto:hover { background: var(--accent-h); }

    .btn-edit, .btn-del {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: .45rem .7rem;
      border-radius: 7px;
      font-size: .8rem;
      cursor: pointer;
      transition: background .2s, color .2s;
    }
    .btn-edit:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn-del:hover  { background: var(--danger); color: #fff; border-color: var(--danger); }

    /* ── Modal Overlay ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.6);
      -webkit-backdrop-filter: blur(4px);
      backdrop-filter: blur(4px);
      z-index: 500;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
      width: 100%;
      max-width: 440px;
      box-shadow: var(--shadow);
      animation: slide-in .2s ease;
    }
    @keyframes slide-in {
      from { opacity: 0; transform: translateY(-16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 1.4rem;
    }

    .form-group { display: flex; flex-direction: column; gap: .4rem; margin-bottom: 1rem; }
    .form-group label { font-size: .82rem; color: var(--text-muted); font-weight: 500; }
    .form-group input,
    .form-group textarea {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: .6rem .85rem;
      font-size: .9rem;
      font-family: inherit;
      outline: none;
      transition: border-color .2s;
      resize: vertical;
    }
    .form-group input:focus,
    .form-group textarea:focus { border-color: var(--accent); }
    .form-group textarea { min-height: 80px; }

    .form-error {
      font-size: .78rem;
      color: var(--danger);
      min-height: 1rem;
      margin-top: -.3rem;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: .6rem;
      margin-top: 1.4rem;
    }

    .btn-cancel {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: .5rem 1.1rem;
      border-radius: 8px;
      font-size: .9rem;
      cursor: pointer;
      transition: background .2s;
    }
    .btn-cancel:hover { background: var(--surface2); }

    .btn-save {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: .5rem 1.3rem;
      border-radius: 8px;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s;
    }
    .btn-save:hover { background: var(--accent-h); }

    /* ── Modal 스크린샷 섹션 ── */
    .modal {
      max-height: 90vh;
      overflow-y: auto;
    }
    .screenshot-preview {
      border-radius: 8px;
      overflow: hidden;
      background: var(--surface2);
      border: 1px dashed var(--border);
      aspect-ratio: 16/9;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: .82rem;
      margin-bottom: .5rem;
      position: relative;
    }
    .screenshot-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
    }
    .ss-loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface2);
      font-size: .85rem;
      color: var(--text-muted);
    }
    .btn-screenshot {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .45rem;
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: .5rem .9rem;
      border-radius: 7px;
      font-size: .84rem;
      font-weight: 500;
      cursor: pointer;
      transition: border-color .2s, color .2s;
      font-family: inherit;
    }
    .btn-screenshot:hover { border-color: var(--accent); color: var(--accent-h); }
    .btn-screenshot:disabled { opacity: .5; cursor: not-allowed; }
    .btn-screenshot.capturing {
      border-color: var(--accent);
      color: var(--accent-h);
      animation: capture-pulse 1.2s ease-in-out infinite;
    }
    @keyframes capture-pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: .55; }
    }

    /* ── Confirm Dialog ── */
    .confirm-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.6);
      -webkit-backdrop-filter: blur(4px);
      backdrop-filter: blur(4px);
      z-index: 600;
      align-items: center;
      justify-content: center;
    }
    .confirm-overlay.open { display: flex; }

    .confirm-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.75rem;
      width: 100%;
      max-width: 340px;
      box-shadow: var(--shadow);
      text-align: center;
    }
    .confirm-box p { margin-bottom: .4rem; font-weight: 600; }
    .confirm-box small { color: var(--text-muted); font-size: .83rem; }
    .confirm-actions {
      display: flex;
      justify-content: center;
      gap: .7rem;
      margin-top: 1.3rem;
    }
    .btn-confirm-del {
      background: var(--danger);
      color: #fff;
      border: none;
      padding: .5rem 1.2rem;
      border-radius: 8px;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
    }

    .header-right { display: flex; align-items: center; gap: .5rem; }
    #metaLoading { display: none; font-size: .75rem; color: var(--accent-h); }

    /* ── Drop Overlay ── */
    .drop-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 900;
      background: rgba(99, 102, 241, .12);
      border: 3px dashed var(--accent);
      border-radius: 0;
      pointer-events: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: .75rem;
      color: var(--accent-h);
      font-size: 1.25rem;
      font-weight: 700;
    }
    .drop-overlay.active { display: flex; }
    .drop-overlay svg { width: 56px; height: 56px; opacity: .8; }
    .drop-overlay small { font-size: .9rem; font-weight: 400; color: var(--text-muted); }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      header { padding: 0 1rem; }
      .logo span { display: none; }
      main { padding: 1.2rem 1rem; }
    }
  </style>
</head>
<body>

<!-- ── Drop Overlay ── -->
<div class="drop-overlay" id="dropOverlay" aria-hidden="true">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
    <path d="M12 3v12m0 0-4-4m4 4 4-4"/>
    <path d="M3 17v2a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-2"/>
  </svg>
  URL을 여기에 놓으세요
  <small>브라우저 주소창 또는 링크를 드래그하여 카드를 추가합니다.</small>
</div>

<!-- ── Header ── -->
<header>
  <div class="logo">
    Bluepapa's Vibecoding
  </div>
  <div class="header-right">
    <button class="btn-add" id="btnOpenAdd">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M12 5v14M5 12h14"/>
      </svg>
      프로젝트 추가
    </button>
  </div>
</header>

<!-- ── Main ── -->
<main>
  <p class="section-title" id="cardCount">프로젝트 0개</p>
  <div class="card-grid" id="cardGrid"></div>
</main>

<!-- ── Add / Edit Modal ── -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <p class="modal-title" id="modalTitle">프로젝트 추가</p>

    <div class="form-group">
      <label for="inputName">프로젝트 이름 *</label>
      <input type="text" id="inputName" placeholder="예) 날씨 대시보드" maxlength="60" />
      <span class="form-error" id="errName"></span>
    </div>

    <div class="form-group">
      <label for="inputDesc">설명 <span id="metaLoading">⚡ 자동 불러오는 중...</span></label>
      <textarea id="inputDesc" placeholder="어떤 앱인지 간단히 설명해주세요." maxlength="200"></textarea>
    </div>

    <div class="form-group">
      <label for="inputUrl">URL *</label>
      <input type="url" id="inputUrl" placeholder="https://example.com" />
      <span class="form-error" id="errUrl"></span>
    </div>

    <div class="form-group">
      <label>카드 스크린샷</label>
      <div class="screenshot-preview" id="ssPreview">
        <span>스크린샷 없음</span>
      </div>
      <button type="button" class="btn-screenshot" id="btnTakeScreenshot">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
        스크린샷 찍기
      </button>
    </div>

    <div class="modal-actions">
      <button class="btn-cancel" id="btnCancel">취소</button>
      <button class="btn-save"   id="btnSave">저장</button>
    </div>
  </div>
</div>

<!-- ── Delete Confirm ── -->
<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <p>정말 삭제할까요?</p>
    <small id="confirmName">이 프로젝트 카드가 목록에서 제거됩니다.</small>
    <div class="confirm-actions">
      <button class="btn-cancel" id="btnConfirmCancel">취소</button>
      <button class="btn-confirm-del" id="btnConfirmDel">삭제</button>
    </div>
  </div>
</div>

<script>
// 웹앱 포트폴리오 CRUD + LocalStorage 관리 스크립트

// ── Storage (Cloudflare KV 서버 저장, localStorage 폴백) ──
let projectsState = [];
let saveTimer = null;

function load() {
  return projectsState;
}

function save(projects) {
  projectsState = projects;
  // 500ms 디바운스: 빠른 연속 저장 시 마지막 상태만 POST
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    fetch('/api/projects', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ projects: projectsState }),
    }).catch(() => {});
  }, 500);
}

async function initProjects() {
  try {
    const res = await fetch('/api/projects');
    if (!res.ok) throw new Error();
    const data = await res.json();
    projectsState = Array.isArray(data.projects) ? data.projects : [];
  } catch {
    projectsState = [];
  }
}
const ICONS = ['🌐','⚡','🔧','🎨','📊','🚀','🛠','💡','🔮','🌟','🔑','📱'];

function getIcon(name) {
  const code = [...name].reduce((s, c) => s + c.charCodeAt(0), 0);
  return ICONS[code % ICONS.length];
}

// ── Render ──
function render() {
  const projects = load();
  const grid = document.getElementById('cardGrid');
  const count = document.getElementById('cardCount');

  count.textContent = `프로젝트 ${projects.length}개`;
  grid.innerHTML = '';

  if (projects.length === 0) {
    grid.innerHTML = `
      <div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="3" width="18" height="18" rx="3"/>
          <path d="M12 8v8M8 12h8"/>
        </svg>
        <p>등록된 프로젝트가 없습니다.</p>
        <small>상단 '프로젝트 추가' 버튼으로 첫 카드를 만들어보세요.</small>
      </div>`;
    return;
  }

  projects.forEach(p => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      ${p.thumb ? `<div class="card-thumb"><div class="thumb-skeleton"></div><img src="${escHtml(p.thumb)}" loading="lazy" alt=""></div>` : ''}
      <div class="card-header">
        <div class="card-icon">${getIcon(p.name)}</div>
        <div>
          <div class="card-title">${escHtml(p.name)}</div>
          <div class="card-url">${escHtml(trimUrl(p.url))}</div>
        </div>
      </div>
      ${p.desc ? `<div class="card-desc">${escHtml(p.desc)}</div>` : ''}
      <div class="card-footer">
        <a class="btn-goto" href="${escAttr(p.url)}" target="_blank" rel="noopener noreferrer">바로가기 ↗</a>
        <button class="btn-edit" data-id="${p.id}">수정</button>
        <button class="btn-del"  data-id="${p.id}">삭제</button>
      </div>`;

    if (p.thumb) {
      const img = card.querySelector('.card-thumb img');
      const skel = card.querySelector('.thumb-skeleton');
      img.addEventListener('load', () => { img.classList.add('loaded'); skel.remove(); });
      img.addEventListener('error', () => { card.querySelector('.card-thumb').remove(); });
      if (img.complete && img.naturalWidth > 0) { img.classList.add('loaded'); skel.remove(); }
    }

    grid.appendChild(card);
  });
}

function escHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function escAttr(url) {
  // URL 검증: http/https 허용
  try {
    const u = new URL(url);
    if (u.protocol !== 'http:' && u.protocol !== 'https:') return '#';
  } catch { return '#'; }
  return escHtml(url);
}

function trimUrl(url) {
  try { const u = new URL(url); return u.hostname + (u.pathname !== '/' ? u.pathname : ''); }
  catch { return url; }
}

// ── Modal 상태 ──
let editingId = null;
let pendingThumb = null;

function openModal(project = null) {
  editingId = project ? project.id : null;
  pendingThumb = project ? (project.thumb || null) : null;
  document.getElementById('modalTitle').textContent = project ? '프로젝트 수정' : '프로젝트 추가';
  document.getElementById('inputName').value = project ? project.name : '';
  document.getElementById('inputDesc').value = project ? project.desc : '';
  document.getElementById('inputUrl').value  = project ? project.url  : '';
  updateSsPreview(pendingThumb);
  clearErrors();
  document.getElementById('modalOverlay').classList.add('open');
  document.getElementById('inputName').focus();
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  editingId = null;
  pendingThumb = null;
}

function clearErrors() {
  document.getElementById('errName').textContent = '';
  document.getElementById('errUrl').textContent  = '';
}

// ── 스크린샷 미리보기 업데이트 ──
function updateSsPreview(thumbUrl) {
  const preview = document.getElementById('ssPreview');
  if (!thumbUrl) { preview.innerHTML = '<span>스크린샷 없음</span>'; return; }
  preview.innerHTML = '';
  const img = document.createElement('img');
  img.alt = '';
  img.style.opacity = '0';
  img.style.transition = 'opacity .3s';
  img.onload = () => { img.style.opacity = '1'; };
  img.onerror = () => { preview.innerHTML = '<span>미리보기 실패</span>'; };
  img.src = thumbUrl;
  preview.appendChild(img);
}

// ── 스크린샷 찍기 ──
async function takeScreenshot() {
  const url = document.getElementById('inputUrl').value.trim();
  if (!url) { document.getElementById('errUrl').textContent = 'URL을 먼저 입력하세요.'; return; }
  try { const u = new URL(url); if (u.protocol !== 'http:' && u.protocol !== 'https:') throw new Error(); }
  catch { document.getElementById('errUrl').textContent = '올바른 URL을 입력하세요.'; return; }

  const preview = document.getElementById('ssPreview');
  const btn     = document.getElementById('btnTakeScreenshot');

  // Screen Capture API 미지원 시 thum.io 폴백
  if (!navigator.mediaDevices?.getDisplayMedia) {
    window.open(url, '_blank', 'noopener,noreferrer');
    preview.innerHTML = '<div class="ss-loading">📷 캡처 중...</div>';
    const thumbUrl = 'https://image.thum.io/get/viewportWidth/390/width/390/crop/219/' + url;
    const img = document.createElement('img');
    img.alt = ''; img.style.cssText = 'opacity:0;transition:opacity .3s';
    img.onload = () => { pendingThumb = thumbUrl; preview.innerHTML = ''; preview.appendChild(img); requestAnimationFrame(() => { img.style.opacity = '1'; }); };
    img.onerror = () => { preview.innerHTML = '<span>스크린샷 실패</span>'; };
    img.src = thumbUrl;
    return;
  }

  // 앱 링크를 새 탭으로 열기
  window.open(url, '_blank', 'noopener,noreferrer');

  preview.innerHTML = '<div class="ss-loading">🖥️ 열린 탭을 선택하세요...</div>';
  btn.disabled = true;
  btn.classList.add('capturing');
  btn.textContent = '캡처 모드 중...';

  let stream;
  try {
    stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });
  } catch {
    preview.innerHTML = '<span>캡처가 취소되었습니다.</span>';
    resetBtn();
    return;
  }

  preview.innerHTML = '<div class="ss-loading">✂️ 이미지 처리 중...</div>';

  const video = document.createElement('video');
  video.srcObject = stream;
  video.muted = true;
  video.play();

  // 첫 프레임 대기
  await new Promise(r => {
    if (video.readyState >= 2) { r(); return; }
    video.onloadeddata = r;
  });
  await new Promise(r => setTimeout(r, 150));

  // 16:9 상단 중앙 크롭
  const W = video.videoWidth;
  const H = video.videoHeight;
  const ta = 16 / 9;
  let sx, sy, sw, sh;
  if (W / H > ta) { sh = H; sw = Math.round(H * ta); sx = Math.round((W - sw) / 2); sy = 0; }
  else            { sw = W; sh = Math.round(W / ta);  sx = 0; sy = 0; }

  const canvas = document.createElement('canvas');
  canvas.width = 400; canvas.height = 225;
  canvas.getContext('2d').drawImage(video, sx, sy, sw, sh, 0, 0, 400, 225);
  stream.getTracks().forEach(t => t.stop());

  const dataUrl = canvas.toDataURL('image/jpeg', 0.82);

  // 클립보드 복사
  try {
    const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
    await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
  } catch { /* 권한 없을 경우 무시 */ }

  // 미리보기 표시
  pendingThumb = dataUrl;
  preview.innerHTML = '';
  const img = document.createElement('img');
  img.alt = ''; img.src = dataUrl;
  img.style.cssText = 'opacity:0;transition:opacity .3s';
  preview.appendChild(img);
  requestAnimationFrame(() => { img.style.opacity = '1'; });

  resetBtn();

  function resetBtn() {
    btn.disabled = false;
    btn.classList.remove('capturing');
    btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg> 스크린샷 찍기`;
  }
}

// ── Validate ──
function validate(name, url) {
  let ok = true;
  if (!name.trim()) {
    document.getElementById('errName').textContent = '이름을 입력하세요.';
    ok = false;
  }
  if (!url.trim()) {
    document.getElementById('errUrl').textContent = 'URL을 입력하세요.';
    ok = false;
  } else {
    try {
      const u = new URL(url.trim());
      if (u.protocol !== 'http:' && u.protocol !== 'https:') {
        document.getElementById('errUrl').textContent = 'http:// 또는 https:// 로 시작하는 URL을 입력하세요.';
        ok = false;
      }
    } catch {
      document.getElementById('errUrl').textContent = '올바른 URL 형식이 아닙니다.';
      ok = false;
    }
  }
  return ok;
}

// ── Save (Create / Update) ──
function saveProject() {
  const name = document.getElementById('inputName').value.trim();
  const desc = document.getElementById('inputDesc').value.trim();
  const url  = document.getElementById('inputUrl').value.trim();

  clearErrors();
  if (!validate(name, url)) return;

  const projects = load();

  if (editingId) {
    const idx = projects.findIndex(p => p.id === editingId);
    if (idx !== -1) {
      projects[idx].name = name;
      projects[idx].desc = desc;
      projects[idx].url = url;
      if (pendingThumb !== null) projects[idx].thumb = pendingThumb;
    }
  } else {
    projects.push({ id: crypto.randomUUID(), name, desc, url, thumb: pendingThumb, createdAt: Date.now() });
  }

  save(projects);
  closeModal();
  render();
}

// ── Delete Confirm ──
let deletingId = null;

function openConfirm(id) {
  deletingId = id;
  const p = load().find(x => x.id === id);
  document.getElementById('confirmName').textContent =
    p ? `"${p.name}" 카드가 목록에서 제거됩니다.` : '이 프로젝트 카드가 목록에서 제거됩니다.';
  document.getElementById('confirmOverlay').classList.add('open');
}

function closeConfirm() {
  document.getElementById('confirmOverlay').classList.remove('open');
  deletingId = null;
}

function deleteProject() {
  if (!deletingId) return;
  const projects = load().filter(p => p.id !== deletingId);
  save(projects);
  closeConfirm();
  render();
}

// ── Event Wiring ──
document.getElementById('btnOpenAdd').addEventListener('click', () => openModal());
document.getElementById('btnCancel').addEventListener('click', closeModal);
document.getElementById('btnSave').addEventListener('click', saveProject);
document.getElementById('btnTakeScreenshot').addEventListener('click', takeScreenshot);

document.getElementById('btnConfirmCancel').addEventListener('click', closeConfirm);
document.getElementById('btnConfirmDel').addEventListener('click', deleteProject);

// 오버레이 클릭 시 닫기
document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});
document.getElementById('confirmOverlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeConfirm();
});

// ESC 키
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeModal(); closeConfirm(); }
});

// Enter 키 (폼)
document.getElementById('inputUrl').addEventListener('keydown', e => {
  if (e.key === 'Enter') saveProject();
});

// URL 입력 후 메타 자동 추옵
document.getElementById('inputUrl').addEventListener('blur', async e => {
  const url = e.target.value.trim();
  if (!url) return;
  try { new URL(url); } catch { return; }

  const nameEl = document.getElementById('inputName');
  const descEl = document.getElementById('inputDesc');
  const loadEl = document.getElementById('metaLoading');
  // 이미 이름과 설명이 모두 있으면 건너뛰
  if (nameEl.value.trim() && descEl.value.trim()) return;

  loadEl.style.display = 'inline';
  try {
    const res  = await fetch(`/api/fetch-meta?url=${encodeURIComponent(url)}`);
    const data = await res.json();
    if (data.title && !nameEl.value.trim()) nameEl.value = data.title;
    if (data.desc  && !descEl.value.trim()) descEl.value = data.desc;
  } catch {}
  finally { loadEl.style.display = 'none'; }
});

// 카드 버튼 이벤트 위임
document.getElementById('cardGrid').addEventListener('click', e => {
  const id = e.target.dataset.id;
  if (!id) return;
  if (e.target.classList.contains('btn-edit')) {
    const p = load().find(x => x.id === id);
    if (p) openModal(p);
  } else if (e.target.classList.contains('btn-del')) {
    openConfirm(id);
  }
});





// ── Drag & Drop ──
let dragCounter = 0;

function extractUrl(dt) {
  // 1순위: text/uri-list (탭·링크 드래그 시 표준 포맷)
  const uriList = dt.getData('text/uri-list');
  if (uriList) {
    const first = uriList.split('\n').map(s => s.trim()).find(s => s && !s.startsWith('#'));
    if (first) return first;
  }
  // 2순위: text/plain (주소창 텍스트 드래그 등)
  const plain = dt.getData('text/plain').trim();
  try { const u = new URL(plain); if (u.protocol === 'http:' || u.protocol === 'https:') return plain; } catch {}
  return null;
}

document.addEventListener('dragenter', e => {
  if (!e.dataTransfer.types.some(t => t === 'text/uri-list' || t === 'text/plain')) return;
  dragCounter++;
  document.getElementById('dropOverlay').classList.add('active');
  e.preventDefault();
});

document.addEventListener('dragleave', e => {
  dragCounter--;
  if (dragCounter <= 0) {
    dragCounter = 0;
    document.getElementById('dropOverlay').classList.remove('active');
  }
});

document.addEventListener('dragover', e => e.preventDefault());

document.addEventListener('drop', e => {
  e.preventDefault();
  dragCounter = 0;
  document.getElementById('dropOverlay').classList.remove('active');

  const url = extractUrl(e.dataTransfer);
  if (!url) return;

  // hostname을 기본 이름으로 제안
  let suggestedName = '';
  try { suggestedName = new URL(url).hostname.replace(/^www\./, ''); } catch {}

  openModal(null);
  document.getElementById('inputUrl').value  = url;
  document.getElementById('inputName').value = suggestedName;
  document.getElementById('inputName').select();
  document.getElementById('inputName').focus();
});

// ── 빈 설명 자동 채우기 (비동기) ──
async function fetchMissingDescriptions() {
  const projects = load().filter(p => !p.desc);
  if (!projects.length) return;

  for (const p of projects) {
    try {
      const res  = await fetch(`/api/fetch-meta?url=${encodeURIComponent(p.url)}`);
      const data = await res.json();
      if (!data.desc) continue;
      // 저장소 재읽기 (동시 수정 경합 방지)
      const all = load();
      const idx = all.findIndex(x => x.id === p.id);
      if (idx !== -1 && !all[idx].desc) {
        all[idx].desc = data.desc;
        save(all);
        render();
      }
    } catch {}
  }
}

// ── Init ──
(async () => {
  await initProjects();
  render();
  fetchMissingDescriptions();
})();
</script>
